
name: Flask API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hussainayub
          password: ${{ secrets.DEMO_SECRET123 }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            hussainayub/flask-calculator-api:latest
            hussainayub/flask-calculator-api:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Pull latest Docker image
        run: docker pull hussainayub/flask-calculator-api:latest

      - name: Stop old container
        run: docker stop flask-api-deployed || true

      - name: Remove old container
        run: docker rm flask-api-deployed || true

      - name: Start updated container
        run: |
          docker run -d \
            --name flask-api-deployed \
            --restart unless-stopped \
            -p 5002:5000 \
            -e APP_ENV=production \
            hussainayub/flask-calculator-api:latest

